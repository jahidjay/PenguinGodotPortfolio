  # --- Wave 5 batch 2 (2026-11-03): UX review cross-document amendments ---
  - name: continue_accept_verb
    value: fire
    unit: input verb (`CONTINUE_ACCEPT`)
    note: "ONE verb accepts a Continue, on both surfaces that can show the prompt: the in-stage HUD
      Continue plate (hud.md Rule 24) and the Stage tally's Continue column (stage-end-tally.md
      Rule 17). `action_glyph(slot, CONTINUE_ACCEPT)` resolves to that slot's Fire glyph. START DOES
      NOT accept a Continue - it still pauses - so there is no accept-versus-Pause priority rule.
      Only the slot in Continue can accept its own. In the Tally the press is not a tally skip."
    source: design/gdd/input-and-player-mapping.md (Rule 24b)
    referenced_by: [input-and-player-mapping, hud, stage-end-tally, game-events-and-session]
  - name: menu_hold_verb
    value: fire
    unit: input verb for every hold-to-confirm
    note: "Holds count `fire.held_ticks` ONLY, on every screen (menus-title-plane-select.md F6,
      interaction-patterns.md P04). Start never starts, advances or completes a hold anywhere;
      Settings opened from Pause ignores Start altogether (Menus Rule 43). Hold length is
      `confirm_hold` (60 at NORMAL, 40 SHORT, 90 LONG), including the 'Reset display' menu item,
      which has the same RESULT as the `display_reset` hotkey but not its 2 s real-time length."
    source: design/gdd/menus-title-plane-select.md (F6, Rule 43)
    referenced_by: [menus-title-plane-select, display-scaler-and-bezel, input-and-player-mapping, accessibility-options]

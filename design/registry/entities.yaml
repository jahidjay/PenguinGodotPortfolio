formulas:
  - name: extend_threshold
    expression: "round(extend_unit * (extend_first_mult + n * extend_step_mult)), compared as integers"
    variables: [extend_unit, extend_first_mult, extend_step_mult, n]
    inputs_owned_elsewhere: {extend_unit: "Scoring (8) - 3,000,000 (scoring F7)"}
    output: "score thresholds; 0..max_score_extends extends due"
    source: design/gdd/game-events-and-session.md (F2)
    referenced_by: [game-events-and-session, scoring, stage-end-tally]
  - name: drone_count
    expression: "min(max_drones, drone_count + powerups_collected); 0 on death"
    variables: [drone_count, powerups_collected, max_drones]
    output: "0-4"
    source: design/gdd/game-events-and-session.md (F1)
    referenced_by: [game-events-and-session, plane-kits-lancer-leech, powerups-and-drops]
  - name: one_credit_clear
    expression: "joined_at_run_start AND continues_used == 0 AND run_ended_by == ENDING AND state != Inactive"
    variables: [joined_at_run_start, continues_used, run_ended_by, state]
    output: bool
    source: design/gdd/game-events-and-session.md (F7)
    referenced_by: [game-events-and-session, save-settings-high-scores, menus-title-plane-select, online-leaderboards-boss-rush]
  - name: swept_hit
    expression: "q0 = p_b(T) - (p_t(T) - p_t(T+1)); q1 = p_b(T+1); hit = dist(p_t(T+1), segment q0->q1) <= r_b + r_t"
    variables: [p_b, p_t, r_b, r_t]
    output: bool
    source: design/gdd/bullet-manager.md (F6)
    referenced_by: [bullet-manager, collision-damage-lives]
  - name: body_contact
    expression: "q0 = p_pl(T) - (p_e(T) - p_e(T+1)); q1 = p_pl(T+1); contact = segdist2(q0->q1, a->b) <= (r_pl + r_e)^2"
    variables: [p_pl, p_e, a, b, r_pl, r_e]
    output: bool (reduces to swept_hit when a == b)
    source: design/gdd/collision-damage-lives.md (C1)
    referenced_by: [collision-damage-lives, enemy-and-ai]
  - name: armour_damage
    expression: "dealt = max(1, (damage * armor_pct) div 100) if armoured; hp' = max(1, hp - dealt) if armoured else max(0, hp - dealt); integer hp/damage"
    variables: [damage, armor_pct, hp, mode]
    output: "dealt 0..damage; result ignored/hit/destroyed"
    source: design/gdd/collision-damage-lives.md (C4)
    referenced_by: [collision-damage-lives, enemy-and-ai, plane-kits-lancer-leech, boss-and-boss-parts]
  - name: chain_critical_break
    expression: "after = min(chain_cap, before * cb_mult + cb_add)"
    variables: [before, cb_mult, cb_add, chain_cap]
    output: "cb_add..999; capped from before >= 317 at defaults"
    source: design/gdd/chain-tracker.md (F4)
    referenced_by: [chain-tracker, critical-break]
  - name: chain_drop_timing
    expression: "window_left = W if fresh this tick else window_left - 1; drop when window_left == 0 and count > 0 (hit on T -> drop at end of T+W)"
    variables: [chain_window, window_left, fresh]
